<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>زد علمك 🎓 - أدوات تعليمية مجانية</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

header {
    background: #1565c0;
    color: white;
    padding: 18px 20px;
}

.header-content {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 8px;
}

.hero {
    text-align: center;
    padding: 55px 20px;
    background: white;
}

.hero h1 {
    font-size: 38px;
    color: #1565c0;
    margin-bottom: 10px;
}

.hero p {
    font-size: 19px;
    color: #555;
}

.search-box {
    margin: 25px auto 0;
    max-width: 600px;
    display: flex;
    gap: 8px;
}

.search-box input {
    flex: 1;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    border: none;
    background: #1565c0;
    color: white;
    padding: 14px 22px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

section {
    max-width: 1100px;
    margin: auto;
    padding: 45px 20px;
}

section h2 {
    text-align: center;
    color: #1565c0;
    margin-bottom: 30px;
}

.tools {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.tool-card {
    background: white;
    padding: 25px 15px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.tool-card .icon {
    font-size: 38px;
}

.tool-card h3 {
    font-size: 18px;
}

.tool-card p {
    color: #666;
    font-size: 14px;
}

.tool-card button {
    margin-top: 10px;
}

.info {
    background: white;
    text-align: center;
    border-radius: 12px;
}

.coming {
    text-align: center;
}

.coming span {
    display: inline-block;
    background: white;
    padding: 12px 18px;
    margin: 6px;
    border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
}

#calculator {
    display: none;
}

.calculator-box {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.calculator-box label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

.calculator-box input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 17px;
}

.result {
    margin-top: 20px;
    padding: 15px;
    background: #eef5ff;
    border-radius: 8px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

footer {
    background: #123b6d;
    color: white;
    text-align: center;
    padding: 30px 20px;
    margin-top: 30px;
}

@media (max-width: 800px) {
    .tools {
        grid-template-columns: repeat(2, 1fr);
    }

    nav {
        display: none;
    }
}

@media (max-width: 500px) {
    .tools {
        grid-template-columns: 1fr;
    }

    .hero h1 {
        font-size: 30px;
    }

    .search-box {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-content">
        <div class="logo">🎓 زد علمك</div>

        <nav>
            <a href="#home">الرئيسية</a>
            <a href="#tools">الأدوات التعليمية</a>
            <a href="#about">عن الموقع</a>
            <a href="#contact">تواصل معنا</a>
        </nav>
    </div>
</header>

<div id="home" class="hero">

    <h1>زد علمك 🎓</h1>

    <p>أدوات تعليمية مجانية تساعدك في الدراسة والحساب والحياة اليومية.</p>

    <div class="search-box">
        <input id="searchInput" type="text" placeholder="🔍 ابحث عن أداة...">
        <button onclick="searchTools()">بحث</button>
    </div>

</div>

<section id="tools">

    <h2>🧮 أدوات تعليم
