<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حاسبة الوقت - زد علمك</title>

<meta name="description" content="حاسبة الوقت المجانية لإضافة أو طرح الساعات والدقائق بسهولة وحساب الوقت الجديد بدقة.">


    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #1565c0;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1565c0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1565c0;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 10px;
            line-height: 2;
            font-size: 18px;
            text-align: center;
        }

        .info {
            margin-top: 25px;
            background: #fafafa;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.9;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">🎓 زد علمك</a>
</header>

<div class="container">

    <div class="card">

        <h1>حاسبة الوقت ⏰</h1>

        <label for="time">الوقت</label>
        <input type="time" id="time">

        <label for="hours">الساعات</label>
        <input type="number" id="hours" min="0" placeholder="مثال: 2">

        <label for="minutes">الدقائق</label>
        <input type="number" id="minutes" min="0" placeholder="مثال: 30">

        <label for="operation">العملية</label>

        <select id="operation">
            <option value="add">إضافة الوقت</option>
            <option value="subtract">طرح الوقت</option>
        </select>

        <button onclick="calculateTime()">احسب الوقت</button>

        <div class="result" id="result">
            أدخل الوقت والمدة ثم اضغط على الزر.
        </div>

    </div>

    <div class="info">

        <h2>📚 كيف تعمل حاسبة الوقت؟</h2>

        <p>
            تساعدك هذه الأداة على إضافة مدة زمنية
            إلى وقت معين أو طرحها منه.
        </p>

        <h3>مثال:</h3>

        <p>
            إذا كان الوقت 10:30 وأضفت ساعتين و15 دقيقة،
            تصبح النتيجة 12:45.
        </p>

    </div>

</div>

<footer>
    © 2026 زد علمك - جميع الحقوق محفوظة
</footer>

<script>

function calculateTime() {

    let timeValue =
        document.getElementById("time").value;

    let hours =
        parseInt(document.getElementById("hours").value) || 0;

    let minutes =
        parseInt(document.getElementById("minutes").value) || 0;

    let operation =
        document.getElementById("operation").value;

    let result =
        document.getElementById("result");


    if (!timeValue) {

        result.innerHTML =
            "⚠️ الرجاء إدخال الوقت.";

        return;
    }


    if (hours < 0 || minutes < 0) {

        result.innerHTML =
            "⚠️ لا يمكن إدخال قيم سالبة.";

        return;
    }


    let parts = timeValue.split(":");

    let totalMinutes =
        parseInt(parts[0]) * 60 +
        parseInt(parts[1]);


    let duration =
        hours * 60 + minutes;


    if (operation === "add") {

        totalMinutes += duration;

    } else {

        totalMinutes -= duration;

    }


    totalMinutes =
        ((totalMinutes % 1440) + 1440) % 1440;


    let newHours =
        Math.floor(totalMinutes / 60);

    let newMinutes =
        totalMinutes % 60;


    let formattedHours =
        String(newHours).padStart(2, "0");

    let formattedMinutes =
        String(newMinutes).padStart(2, "0");


    result.innerHTML =
        "⏰ النتيجة:<br><strong>" +
        formattedHours +
        ":" +
        formattedMinutes +
        "</strong>";
}

</script>

</body>

</html>
